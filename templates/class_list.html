{% extends 'base.html' %}
{% block content %}
<div class="space-y-6">
<div class="flex justify-between items-center mb-4">
<h1 class="text-2xl font-bold">Classes</h1>
<a href="{% url 'class_add' %}" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800">+ Add Class</a>
</div>
<table class="w-full text-left border border-gray-200 rounded">
<thead class="bg-slate-800 text-white">
<tr>
<th class="px-4 py-2">Class Name</th>
<th class="px-4 py-2">Section</th>
<th class="px-4 py-2">Level</th> 
<th class="px-4 py-2 text-center">Actions</th>
</tr>
</thead>
<tbody class="divide-y">
{% for c in classes %}
<tr class="hover:bg-slate-50">
<td class="px-4 py-2">{{ c.name }}</td>
<td class="px-4 py-2">{{ c.section }}</td>
<td class="px-4 py-2">{{ c.level }}</td> 
<td class="px-4 py-2 flex gap-2 justify-center">
<a href="{% url 'class_edit' c.id %}" class="px-3 py-1 bg-emerald-500 text-white text-xs rounded hover:bg-emerald-600">Edit</a>
<a href="{% url 'class_delete' c.id %}" class="px-3 py-1 bg-red-500 text-white text-xs rounded hover:bg-red-600">Delete</a>
</td>
</tr>
{% empty %}
<tr><td colspan="3" class="text-center py-2">No classes found.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
