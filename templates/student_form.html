{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded-xl shadow-lg">
<h2 class="text-xl font-semibold mb-4">{{ title }}</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded mt-4">Save</button>
</form>
</div>
{% endblock %}
