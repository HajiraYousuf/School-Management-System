<!-- BACKDROP -->
<div id="editteacherModal" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4 hidden">

<!-- MODAL -->
<div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 animate-fadeIn">

<!-- HEADER -->
<div class="flex items-center justify-between px-6 py-4 bg-blue-800 rounded-t-2xl">

<h2 class="text-lg font-semibold text-white">
Edit Teacher
</h2>

<button onclick="closeEditModal()" class="text-white hover:text-red-400 text-xl">
✕
</button>

</div>


<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<!-- BODY -->
<div class="p-6 space-y-5 max-h-[70vh] overflow-y-auto">

<!-- NAME + PHONE -->
<div class="grid grid-cols-2 gap-4">

<div>
<label class="text-xs font-semibold text-gray-600">Teacher Name</label>

<input type="text" name="name" id="editName"
class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1
focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
</div>

<div>
<label class="text-xs font-semibold text-gray-600">Phone</label>

<input type="text" name="phone" id="editPhone"
class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1
focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
</div>

</div>


<!-- LEVEL + SALARY -->
<div class="grid grid-cols-2 gap-4">

<div>
<label class="text-xs font-semibold text-gray-600">Level</label>

<select name="level" id="editLevel"
class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1
focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

<option value="Primary">Primary</option>
<option value="Secondary">Secondary</option>

</select>
</div>

<div>
<label class="text-xs font-semibold text-gray-600">Salary</label>

<input type="number" name="salary" id="editSalary"
class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1
focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
</div>

</div>

<!-- CLASSES + SUBJECTS -->
<div class="grid grid-cols-2 gap-6">

  <!-- CLASSES -->
  <div>
    <p class="text-sm font-semibold text-gray-700 mb-2">Classes</p>
    <div class="border border-gray-200 rounded-xl p-4 space-y-2 bg-gray-50">
      {% for cls in classes %}
      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
        <input type="checkbox" name="classes[]" value="{{ cls.id }}"
        class="accent-blue-600"
        {% if cls in teacher.classes.all %} checked {% endif %}>
        {{ cls.name }}
      </label>
      {% endfor %}
    </div>
  </div>

  <!-- SUBJECTS -->
  <div>
    <p class="text-sm font-semibold text-gray-700 mb-2">Subjects</p>
    <div class="border border-gray-200 rounded-xl p-4 space-y-2 bg-gray-50">
      {% for subj in subjects %}
      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
        <input type="checkbox" name="subjects[]" value="{{ subj.id }}"
        class="accent-blue-600"
        {% if subj in teacher.subjects.all %} checked {% endif %}>
        {{ subj.name }}
      </label>
      {% endfor %}
    </div>
  </div>

</div>

<!-- CV -->
<div>

<label class="text-xs font-semibold text-gray-600">
Upload CV
</label>

<input type="file" name="cv"
class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mt-1">

</div>

</div>


<!-- FOOTER -->
<div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-2xl">

<button type="button"
onclick="closeEditModal()"
class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-100">

Cancel

</button>

<button type="submit"
class="px-5 py-2 text-sm bg-blue-700 text-white rounded-lg hover:bg-blue-600 shadow">

Update Teacher

</button>

</div>

</form>

</div>
</div>
